<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiker Wa-Web</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Inline spinner styling */
        #loading {
            display: none;
            text-align: center;
            margin-top: 50px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Chat list container */
        .chat {
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }

        .chat-info h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .chat-info p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>Reiker Wa-Web</h1>
    </header>
    <main>
        <!-- Loading spinner -->
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading messages...</p>
        </div>
        <!-- Chats will be dynamically loaded here -->
        <div id="chat-list"></div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const chatList = document.getElementById('chat-list');
const loadingSpinner = document.getElementById('loading');
const socket = io(); // Connect to WebSocket

// Function to show/hide loading spinner
function toggleLoading(show) {
    loadingSpinner.style.display = show ? 'block' : 'none';
    chatList.style.display = show ? 'none' : 'block';
}

// Group messages by chat name
function groupMessagesByChat(messages) {
    return messages.reduce((grouped, message) => {
        if (!grouped[message.chatName]) {
            grouped[message.chatName] = [];
        }
        grouped[message.chatName].push(message);
        return grouped;
    }, {});
}

// Function to render grouped chats
function renderGroupedChats(chats) {
    chatList.innerHTML = ''; // Clear the current list
    const groupedChats = groupMessagesByChat(chats);

    Object.entries(groupedChats).forEach(([chatName, messages]) => {
        const chatGroup = document.createElement('div');
        chatGroup.className = 'chat-group';

        // Chat header
        const chatHeader = document.createElement('div');
        chatHeader.className = 'chat-header';
        chatHeader.innerText = chatName; // Use the chat name
        chatGroup.appendChild(chatHeader);

        // Messages
        messages.forEach((msg) => {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.sender === 'You' ? 'user' : ''}`;
            messageDiv.innerText = msg.content || '[Media]';
            chatGroup.appendChild(messageDiv);
        });

        chatList.appendChild(chatGroup);
    });
}

// Function to fetch and render chat list
async function loadChatList() {
    toggleLoading(true); // Show loading spinner
    try {
        const res = await fetch('/messages.json');
        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        const chats = await res.json();
        renderGroupedChats(chats); // Render the chats
    } catch (err) {
        console.error('Failed to load chat list:', err);
        chatList.innerHTML = '<p>Failed to load chats. Try again later.</p>';
    } finally {
        toggleLoading(false); // Hide loading spinner
    }
}

// Initial fetch of chat list
loadChatList();

// Listen for new messages via WebSocket
socket.on('new_message', (newMessage) => {
    // Reload the chat list whenever a new message is received
    loadChatList();
});
    </script>
</body>
</html>
